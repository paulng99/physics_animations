<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radioactive Decay and Half-life (HKDSE)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    mjx-container { display: inline-block !important; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-blue-50 text-slate-800">
  <header class="max-w-6xl mx-auto px-4 py-4">
    <div class="flex items-center justify-between gap-3">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-blue-600 hover:text-blue-700">
        <span>←</span><span data-i18n="back">Back to Topics</span>
      </a>
      <div class="flex gap-2">
        <button class="lang-btn px-3 py-1 rounded-lg text-sm font-medium bg-blue-600 text-white" onclick="updateLanguage('en')" data-lang="en">EN</button>
        <button class="lang-btn px-3 py-1 rounded-lg text-sm font-medium text-slate-600 hover:bg-blue-100" onclick="updateLanguage('zh-hk')" data-lang="zh-hk">繁</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-10">
    <section class="bg-white/85 backdrop-blur rounded-2xl border border-slate-200 p-5 md:p-7 shadow-sm">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900" data-i18n="title">Radioactive Decay and Half-life</h1>
      <p class="mt-2 text-slate-600" data-i18n="subtitle">Observe random decay and compare measured counts with the theoretical decay law.</p>
    </section>

    <section class="mt-5 grid lg:grid-cols-3 gap-4">
      <article class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-4">
        <canvas id="decayCanvas" width="980" height="520" class="w-full rounded-xl border border-slate-200 bg-slate-50"></canvas>
        <div class="mt-3 flex gap-2 flex-wrap">
          <button id="startBtn" class="px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition" data-i18n="start">Start</button>
          <button id="pauseBtn" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-800 font-semibold hover:bg-slate-300 transition" data-i18n="pause">Pause</button>
          <button id="resetBtn" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-800 font-semibold hover:bg-slate-300 transition" data-i18n="reset">Reset</button>
        </div>
      </article>
      <aside class="space-y-4">
        <div class="bg-white rounded-2xl border border-slate-200 p-4">
          <h2 class="font-semibold text-slate-900 mb-3" data-i18n="controls">Controls</h2>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            <span data-i18n="initialN">Initial nuclei N₀</span>: <span id="n0Out" class="font-semibold text-blue-600">200</span>
          </label>
          <input id="initialN" type="range" min="50" max="600" step="10" value="200" class="w-full accent-blue-600 mb-3" />
          <label class="block text-sm font-medium text-slate-700 mb-1">
            <span data-i18n="halfLife">Half-life T½ (s)</span>: <span id="halfOut" class="font-semibold text-blue-600">8.0</span>
          </label>
          <input id="halfLife" type="range" min="2" max="20" step="0.5" value="8" class="w-full accent-blue-600 mb-3" />
          <label class="block text-sm font-medium text-slate-700 mb-1">
            <span data-i18n="timeStep">Time step Δt (s)</span>: <span id="stepOut" class="font-semibold text-blue-600">0.20</span>
          </label>
          <input id="timeStep" type="range" min="0.05" max="1" step="0.05" value="0.2" class="w-full accent-blue-600" />
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 text-sm">
          <h2 class="font-semibold text-slate-900 mb-2" data-i18n="readings">Readings</h2>
          <div class="space-y-1">
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="time">Time</span><span id="tOut" class="font-semibold text-purple-600">0.00 s</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="remaining">Remaining N</span><span id="nOut" class="font-semibold text-green-600">200</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="activity">Activity (ΔN/Δt)</span><span id="aOut" class="font-semibold text-red-600">0.0 s⁻¹</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="theory">Theory N(t)</span><span id="theoryOut" class="font-semibold text-amber-600">200.0</span></div>
          </div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 text-sm text-slate-700">
          <h2 class="font-semibold text-slate-900 mb-2" data-i18n="formulaTitle">HKDSE Formula Focus</h2>
          <ul class="list-disc ml-5 space-y-1">
            <li><span class="font-medium">N = N₀(1/2)<sup>t/T½</sup></span></li>
            <li><span class="font-medium">A = λN</span></li>
            <li><span class="font-medium">λ = ln2 / T½</span></li>
          </ul>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('decayCanvas');
    const ctx = canvas.getContext('2d');
    const controls = {
      initialN: document.getElementById('initialN'),
      halfLife: document.getElementById('halfLife'),
      timeStep: document.getElementById('timeStep')
    };
    const out = {
      n0Out: document.getElementById('n0Out'),
      halfOut: document.getElementById('halfOut'),
      stepOut: document.getElementById('stepOut'),
      tOut: document.getElementById('tOut'),
      nOut: document.getElementById('nOut'),
      aOut: document.getElementById('aOut'),
      theoryOut: document.getElementById('theoryOut')
    };
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    const translations = {
      en: {
        back: 'Back to Topics',
        title: 'Radioactive Decay and Half-life',
        subtitle: 'Observe random decay and compare measured counts with the theoretical decay law.',
        start: 'Start',
        pause: 'Pause',
        reset: 'Reset',
        controls: 'Controls',
        initialN: 'Initial nuclei N₀',
        halfLife: 'Half-life T½ (s)',
        timeStep: 'Time step Δt (s)',
        readings: 'Readings',
        time: 'Time',
        remaining: 'Remaining N',
        activity: 'Activity (ΔN/Δt)',
        theory: 'Theory N(t)',
        formulaTitle: 'HKDSE Formula Focus'
      },
      'zh-hk': {
        back: '返回主題頁',
        title: '放射性衰變與半衰期',
        subtitle: '觀察隨機衰變，並比較量度數據與理論衰變曲線。',
        start: '開始',
        pause: '暫停',
        reset: '重設',
        controls: '控制面板',
        initialN: '初始核數 N₀',
        halfLife: '半衰期 T½ (s)',
        timeStep: '時間步長 Δt (s)',
        readings: '讀數',
        time: '時間',
        remaining: '剩餘 N',
        activity: '活度 (ΔN/Δt)',
        theory: '理論 N(t)',
        formulaTitle: 'HKDSE 重點公式'
      }
    };

    const state = {
      running: false,
      t: 0,
      N0: 200,
      N: 200,
      halfLife: 8,
      step: 0.2,
      points: [],
      theoryPoints: []
    };

    function syncControls() {
      state.N0 = Number(controls.initialN.value);
      state.halfLife = Number(controls.halfLife.value);
      state.step = Number(controls.timeStep.value);
      out.n0Out.textContent = state.N0.toFixed(0);
      out.halfOut.textContent = state.halfLife.toFixed(1);
      out.stepOut.textContent = state.step.toFixed(2);
    }

    function resetSimulation() {
      syncControls();
      state.running = false;
      state.t = 0;
      state.N = state.N0;
      state.points = [{ t: 0, N: state.N0 }];
      state.theoryPoints = [{ t: 0, N: state.N0 }];
      out.aOut.textContent = '0.0 s⁻¹';
      updateReadings();
    }

    function updateReadings() {
      const lambda = Math.log(2) / state.halfLife;
      const theoryN = state.N0 * Math.exp(-lambda * state.t);
      out.tOut.textContent = `${state.t.toFixed(2)} s`;
      out.nOut.textContent = `${state.N}`;
      out.theoryOut.textContent = theoryN.toFixed(1);
    }

    function stepSimulation() {
      if (!state.running) return;
      const lambda = Math.log(2) / state.halfLife;
      const decayProb = 1 - Math.exp(-lambda * state.step);
      let decayed = 0;
      for (let i = 0; i < state.N; i += 1) {
        if (Math.random() < decayProb) decayed += 1;
      }
      state.N -= decayed;
      state.t += state.step;
      const theoryN = state.N0 * Math.exp(-lambda * state.t);
      state.points.push({ t: state.t, N: state.N });
      state.theoryPoints.push({ t: state.t, N: theoryN });
      out.aOut.textContent = `${(decayed / state.step).toFixed(1)} s⁻¹`;
      updateReadings();
    }

    function drawGraph() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const margin = 60;
      const w = canvas.width - margin * 2;
      const h = canvas.height - margin * 2;
      const tMax = Math.max(25, state.points[state.points.length - 1].t + 1);
      const nMax = Math.max(10, state.N0);
      const xScale = w / tMax;
      const yScale = h / nMax;
      const toX = (t) => margin + t * xScale;
      const toY = (n) => canvas.height - margin - n * yScale;

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(margin, margin);
      ctx.lineTo(margin, canvas.height - margin);
      ctx.lineTo(canvas.width - margin, canvas.height - margin);
      ctx.stroke();

      ctx.font = '13px Inter';
      ctx.fillStyle = '#475569';
      ctx.fillText('t (s)', canvas.width - margin + 6, canvas.height - margin + 5);
      ctx.fillText('N', margin - 24, margin - 8);

      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      state.points.forEach((p, i) => {
        const x = toX(p.t);
        const y = toY(p.N);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.beginPath();
      state.theoryPoints.forEach((p, i) => {
        const x = toX(p.t);
        const y = toY(p.N);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ctx.fillStyle = '#2563eb';
      ctx.fillText(document.documentElement.lang === 'zh-HK' ? '量度' : 'Measured', margin + 10, margin + 14);
      ctx.fillStyle = '#d97706';
      ctx.fillText(document.documentElement.lang === 'zh-HK' ? '理論' : 'Theory', margin + 80, margin + 14);
    }

    function animate() {
      stepSimulation();
      drawGraph();
      requestAnimationFrame(animate);
    }

    function updateLanguage(lang) {
      localStorage.setItem('preferred_language', lang);
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        const text = translations[lang] && translations[lang][key];
        if (text) el.innerText = text;
      });
      document.documentElement.lang = lang === 'zh-hk' ? 'zh-HK' : 'en';
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle('bg-blue-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-600', !active);
      });
    }

    controls.initialN.addEventListener('input', () => { syncControls(); if (!state.running) resetSimulation(); });
    controls.halfLife.addEventListener('input', () => { syncControls(); if (!state.running) resetSimulation(); });
    controls.timeStep.addEventListener('input', () => { syncControls(); });
    startBtn.addEventListener('click', () => { state.running = true; });
    pauseBtn.addEventListener('click', () => { state.running = false; });
    resetBtn.addEventListener('click', resetSimulation);

    resetSimulation();
    updateLanguage(localStorage.getItem('preferred_language') === 'zh-hk' ? 'zh-hk' : 'en');
    animate();
  </script>
</body>
</html>
