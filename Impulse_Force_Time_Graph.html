<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impulse and Force-Time Graph (3D HKDSE)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    mjx-container { display: inline-block !important; }
    .glass { background: rgba(255, 255, 255, 0.86); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-blue-50 text-slate-800">
  <header class="max-w-7xl mx-auto px-4 py-4">
    <div class="flex items-center justify-between gap-3">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-blue-600 hover:text-blue-700">
        <span>←</span><span data-i18n="back">Back to Topics</span>
      </a>
      <div class="flex gap-2">
        <button class="lang-btn px-3 py-1 rounded-lg text-sm font-medium bg-blue-600 text-white" onclick="updateLanguage('en')" data-lang="en">EN</button>
        <button class="lang-btn px-3 py-1 rounded-lg text-sm font-medium text-slate-600 hover:bg-blue-100" onclick="updateLanguage('zh-hk')" data-lang="zh-hk">繁</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 pb-12">
    <section class="glass rounded-3xl border border-white/70 p-6 md:p-8 shadow-xl shadow-blue-100/40">
      <h1 class="text-2xl md:text-4xl font-extrabold text-slate-900" data-i18n="title">Impulse and Force-Time (3D Collision Lab)</h1>
      <p class="mt-3 text-slate-600" data-i18n="subtitle">3D cart-wall collision with dynamic force pulse and numerical impulse integration.</p>
    </section>

    <section class="mt-6 grid xl:grid-cols-[1.45fr_1fr] gap-5">
      <article class="glass rounded-3xl border border-white/70 p-4 md:p-5 shadow-lg shadow-blue-100/30">
        <canvas id="motionCanvas" width="1200" height="360" class="w-full rounded-2xl border border-slate-200 bg-slate-50"></canvas>
        <div class="mt-3 rounded-2xl border border-slate-200 bg-slate-50 p-3">
          <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2" data-i18n="pulsePanel">Force pulse progression</div>
          <div class="h-2 rounded-full bg-slate-200 overflow-hidden">
            <div id="forceBar" class="h-full bg-red-500 transition-all duration-75" style="width:0%"></div>
          </div>
          <div class="mt-2 flex justify-between text-xs text-slate-600">
            <span id="forceNow">F(t)=0.00 N</span>
            <span id="impulseNow">∫Fdt=0.00 N·s</span>
          </div>
        </div>
        <div class="mt-3 flex gap-2">
          <button id="runBtn" class="px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition" data-i18n="run">Run</button>
          <button id="resetBtn" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 font-semibold hover:bg-slate-300 transition" data-i18n="reset">Reset</button>
        </div>
      </article>

      <aside class="space-y-4">
        <div class="glass rounded-2xl border border-white/70 p-4">
          <h2 class="font-semibold text-slate-900 mb-3" data-i18n="controls">Controls</h2>
          <label class="block text-sm text-slate-700"><span data-i18n="mass">Mass m (kg)</span>: <span id="massOut" class="font-semibold text-blue-600">1.00</span></label>
          <input id="mass" type="range" min="0.5" max="5" step="0.1" value="1" class="w-full accent-blue-600 mb-3" />
          <label class="block text-sm text-slate-700"><span data-i18n="u">Initial speed u (m/s)</span>: <span id="uOut" class="font-semibold text-green-600">6.00</span></label>
          <input id="u" type="range" min="1" max="12" step="0.1" value="6" class="w-full accent-green-600 mb-3" />
          <label class="block text-sm text-slate-700"><span data-i18n="v">Final speed v (m/s)</span>: <span id="vOut" class="font-semibold text-green-600">-2.00</span></label>
          <input id="v" type="range" min="-10" max="10" step="0.1" value="-2" class="w-full accent-green-600 mb-3" />
          <label class="block text-sm text-slate-700"><span data-i18n="dt">Contact time Δt (ms)</span>: <span id="dtOut" class="font-semibold text-purple-600">120</span></label>
          <input id="dt" type="range" min="20" max="300" step="1" value="120" class="w-full accent-purple-600 mb-3" />
          <label class="block text-sm text-slate-700" for="shape"><span data-i18n="shape">Pulse shape</span></label>
          <select id="shape" class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white">
            <option value="gaussian">Gaussian</option>
            <option value="triangular">Triangular</option>
            <option value="rect">Rectangular</option>
          </select>
        </div>

        <div class="glass rounded-2xl border border-white/70 p-4 text-sm">
          <h2 class="font-semibold text-slate-900 mb-2" data-i18n="results">Results</h2>
          <div class="space-y-1">
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="deltaP">Δp</span><span id="dpRes" class="font-semibold text-blue-600">-8.00 kg·m/s</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="impulse">Impulse J</span><span id="jRes" class="font-semibold text-red-600">-8.00 N·s</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="favg">Average force</span><span id="fRes" class="font-semibold text-amber-600">-66.67 N</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="integral">Graph integral</span><span id="intRes" class="font-semibold text-purple-600">0.00 N·s</span></div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const mass = document.getElementById('mass');
    const u = document.getElementById('u');
    const v = document.getElementById('v');
    const dt = document.getElementById('dt');
    const shape = document.getElementById('shape');
    const massOut = document.getElementById('massOut');
    const uOut = document.getElementById('uOut');
    const vOut = document.getElementById('vOut');
    const dtOut = document.getElementById('dtOut');
    const dpRes = document.getElementById('dpRes');
    const jRes = document.getElementById('jRes');
    const fRes = document.getElementById('fRes');
    const intRes = document.getElementById('intRes');
    const runBtn = document.getElementById('runBtn');
    const resetBtn = document.getElementById('resetBtn');
    const motionCanvas = document.getElementById('motionCanvas');
    const forceBar = document.getElementById('forceBar');
    const forceNow = document.getElementById('forceNow');
    const impulseNow = document.getElementById('impulseNow');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);
    const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ canvas: motionCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    camera.position.set(-1.8, 4.4, 9.7);
    camera.lookAt(5.2, 0.7, 0);

    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(15, 0.2, 4),
      new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 1 })
    );
    ground.position.set(5, -0.1, 0);
    scene.add(ground);

    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(0.32, 2.7, 3.3),
      new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.72 })
    );
    wall.position.set(11.2, 1.25, 0);
    scene.add(wall);

    const cart = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 0.8, 0.9),
      new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.38, metalness: 0.08 })
    );
    cart.position.set(0.6, 0.45, 0);
    scene.add(cart);

    const wheelGeom = new THREE.CylinderGeometry(0.14, 0.14, 0.16, 20);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
    const wheels = [];
    [[-0.34,-0.32], [0.34,-0.32], [-0.34,0.32], [0.34,0.32]].forEach(([x,z]) => {
      const w = new THREE.Mesh(wheelGeom, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(x, -0.02, z);
      cart.add(w);
      wheels.push(w);
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light = new THREE.DirectionalLight(0xffffff, 0.85);
    light.position.set(4, 8, 5);
    scene.add(light);
    scene.add(new THREE.DirectionalLight(0x93c5fd, 0.4));

    const forceArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0xDC2626, 0.35, 0.18);
    forceArrow.position.set(0, 1.15, 0);
    scene.add(forceArrow);

    const translations = {
      en: {
        back: 'Back to Topics', title: 'Impulse and Force-Time (3D Collision Lab)', subtitle: '3D cart-wall collision with dynamic force pulse and numerical impulse integration.',
        run: 'Run', reset: 'Reset', controls: 'Controls', mass: 'Mass m (kg)', u: 'Initial speed u (m/s)', v: 'Final speed v (m/s)', dt: 'Contact time Δt (ms)', shape: 'Pulse shape',
        pulsePanel: 'Force pulse progression',
        results: 'Results', deltaP: 'Δp', impulse: 'Impulse J', favg: 'Average force', integral: 'Graph integral'
      },
      'zh-hk': {
        back: '返回主題頁', title: '衝量與力-時間（3D 碰撞實驗）', subtitle: '以 3D 小車撞牆示範力脈衝，並用圖像積分驗證衝量。',
        run: '開始', reset: '重設', controls: '控制面板', mass: '質量 m (kg)', u: '初速度 u (m/s)', v: '末速度 v (m/s)', dt: '接觸時間 Δt (ms)', shape: '脈衝形狀',
        pulsePanel: '力脈衝進度',
        results: '結果', deltaP: 'Δp', impulse: '衝量 J', favg: '平均力', integral: '圖像積分'
      }
    };

    const state = {
      running: false,
      t: 0,
      duration: 2.4,
      integral: 0,
      phaseStart: 0.9,
      phaseEnd: 1.1,
      prevTs: performance.now()
    };

    function compute() {
      const m = Number(mass.value);
      const uVal = Number(u.value);
      const vVal = Number(v.value);
      const dtSec = Number(dt.value) / 1000;
      const dp = m * (vVal - uVal);
      const favg = dp / dtSec;
      return { m, uVal, vVal, dtSec, dp, J: dp, favg };
    }

    function pulseAt(t, c) {
      const center = (state.phaseStart + state.phaseEnd) * 0.5;
      const width = Math.max(c.dtSec * 0.7, 0.01);
      if (shape.value === 'gaussian') {
        const x = (t - center) / width;
        return c.favg * Math.exp(-x * x);
      }
      if (shape.value === 'triangular') {
        const d = Math.abs(t - center) / (width * 1.2);
        return d > 1 ? 0 : c.favg * (1 - d);
      }
      if (t < center - width || t > center + width) return 0;
      return c.favg;
    }

    function updatePulsePanel(c, tNow) {
      const N = 280;
      let integral = 0;
      let prevF = pulseAt(0, c);
      for (let i = 1; i <= N; i += 1) {
        const t = (i / N) * state.duration;
        const f = pulseAt(t, c);
        if (t <= tNow) integral += ((f + prevF) * 0.5) * (state.duration / N);
        prevF = f;
      }
      state.integral = integral;
      intRes.textContent = `${integral.toFixed(2)} N·s`;
      const fNowVal = pulseAt(tNow, c);
      const ratio = Math.min(1, Math.max(0, tNow / state.duration));
      forceBar.style.width = `${(ratio * 100).toFixed(1)}%`;
      forceNow.textContent = `F(t)=${fNowVal.toFixed(2)} N`;
      impulseNow.textContent = `∫Fdt=${integral.toFixed(2)} N·s`;
    }

    function updateReadings() {
      const c = compute();
      massOut.textContent = c.m.toFixed(2);
      uOut.textContent = c.uVal.toFixed(2);
      vOut.textContent = c.vVal.toFixed(2);
      dtOut.textContent = (c.dtSec * 1000).toFixed(0);
      dpRes.textContent = `${c.dp.toFixed(2)} kg·m/s`;
      jRes.textContent = `${c.J.toFixed(2)} N·s`;
      fRes.textContent = `${c.favg.toFixed(2)} N`;
    }

    function update3D(dtSec) {
      const c = compute();
      if (state.running) state.t += dtSec;
      if (state.t >= state.duration) { state.t = state.duration; state.running = false; }

      const t = state.t;
      let x = 0.6;
      if (t < state.phaseStart) {
        const r = t / state.phaseStart;
        x = 0.6 + r * 9.7;
      } else if (t <= state.phaseEnd) {
        const r = (t - state.phaseStart) / Math.max((state.phaseEnd - state.phaseStart), 1e-6);
        x = 10.3 + r * 0.6;
      } else {
        const r = (t - state.phaseEnd) / Math.max((state.duration - state.phaseEnd), 1e-6);
        x = 10.9 + r * (compute().vVal >= 0 ? 1.1 : -3.8);
      }
      cart.position.x = Math.max(0.5, Math.min(11.05, x));
      wheels.forEach((w) => { w.rotation.x -= ((t < state.phaseStart ? c.uVal : c.vVal) * dtSec) / 0.14; });

      const fNow = pulseAt(t, c);
      forceArrow.position.set(cart.position.x, 1.12, 0);
      forceArrow.setDirection(new THREE.Vector3(fNow >= 0 ? 1 : -1, 0, 0));
      forceArrow.setLength(Math.min(2.3, Math.max(0.3, Math.abs(fNow) / 50)), 0.35, 0.18);

      updatePulsePanel(c, t);
      renderer.render(scene, camera);
    }

    function resize3D() {
      const rect = motionCanvas.getBoundingClientRect();
      const w = Math.max(320, Math.floor(rect.width));
      const h = Math.max(220, Math.floor(rect.height));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function animate(ts) {
      const dtSec = Math.min(0.03, (ts - state.prevTs) / 1000);
      state.prevTs = ts;
      update3D(dtSec);
      requestAnimationFrame(animate);
    }

    function resetRun() {
      state.running = false;
      state.t = 0;
      state.integral = 0;
      updateReadings();
    }

    function updateLanguage(lang) {
      localStorage.setItem('preferred_language', lang);
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        const text = translations[lang] && translations[lang][key];
        if (text) el.textContent = text;
      });
      document.documentElement.lang = lang === 'zh-hk' ? 'zh-HK' : 'en';
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle('bg-blue-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-600', !active);
      });
    }

    runBtn.addEventListener('click', () => { state.running = true; state.t = 0; });
    resetBtn.addEventListener('click', resetRun);
    [mass, u, v, dt, shape].forEach((el) => el.addEventListener('input', resetRun));
    window.addEventListener('resize', resize3D);

    resize3D();
    updateReadings();
    updateLanguage(localStorage.getItem('preferred_language') === 'zh-hk' ? 'zh-hk' : 'en');
    requestAnimationFrame(animate);
  </script>

    <!-- Practice Questions Widget -->
    <script src="practice_questions.js"></script>
    <script src="practice_questions_data.js"></script>
    <script>initPracticeQuestions('impulse_force_time');</script>
</body>
</html>
