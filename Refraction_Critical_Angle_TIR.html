<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Refraction and TIR Studio (HKDSE)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    mjx-container { display: inline-block !important; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-blue-50 text-slate-800">
  <header class="max-w-7xl mx-auto px-4 py-4">
    <div class="flex items-center justify-between gap-3">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-blue-600 hover:text-blue-700">
        <span>←</span><span data-i18n="back">Back to Topics</span>
      </a>
      <div class="flex gap-2">
        <button class="lang-btn px-3 py-1 rounded-lg text-sm font-medium bg-blue-600 text-white" data-lang="en" onclick="updateLanguage('en')">EN</button>
        <button class="lang-btn px-3 py-1 rounded-lg text-sm font-medium text-slate-600 hover:bg-blue-100" data-lang="zh-hk" onclick="updateLanguage('zh-hk')">繁</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 pb-12">
    <section class="bg-white/85 backdrop-blur rounded-3xl border border-slate-200 p-6 md:p-8 shadow-xl shadow-blue-100/40">
      <h1 class="text-2xl md:text-4xl font-extrabold text-slate-900" data-i18n="title">3D Refraction, Critical Angle and TIR Studio</h1>
      <p class="mt-3 text-slate-600" data-i18n="subtitle">All ray behavior is rendered in 3D with transparent media blocks and dynamic ray vectors.</p>
    </section>

    <section class="mt-6 grid xl:grid-cols-[1.4fr_1fr] gap-5">
      <article class="bg-white rounded-3xl border border-slate-200 p-4 shadow-lg shadow-blue-100/30">
        <div class="relative rounded-2xl border border-slate-200 overflow-hidden" style="touch-action:none">
          <canvas id="sceneCanvas" width="1180" height="640" class="w-full h-[340px] md:h-[480px] cursor-grab active:cursor-grabbing bg-slate-50"></canvas>
          <div class="absolute bottom-3 right-3 bg-slate-900/75 text-white text-xs px-3 py-1.5 rounded-full pointer-events-none" data-i18n="camHint">Drag to rotate • Pinch to zoom</div>
          <div class="absolute bottom-3 left-3 flex flex-wrap gap-2 text-[11px] pointer-events-none">
            <span class="bg-white/90 text-red-600 px-2 py-1 rounded-full font-semibold" data-i18n="legend.incident">Incident</span>
            <span class="bg-white/90 text-green-600 px-2 py-1 rounded-full font-semibold" data-i18n="legend.refracted">Refracted</span>
            <span class="bg-white/90 text-purple-600 px-2 py-1 rounded-full font-semibold" data-i18n="legend.reflected">Reflected</span>
          </div>
        </div>
      </article>

      <aside class="space-y-4">
        <div class="bg-white rounded-2xl border border-slate-200 p-4">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-semibold text-slate-900" data-i18n="controls">Controls</h2>
            <button id="resetBtn" class="text-xs font-bold text-blue-600 hover:text-blue-700" data-i18n="reset">Reset</button>
          </div>
          <label class="block text-sm text-slate-700" for="n1"><span data-i18n="n1">Upper medium n₁</span>: <span id="n1Out" class="font-semibold text-blue-600">1.00</span></label>
          <input id="n1" type="range" min="1.00" max="2.20" step="0.01" value="1.00" class="w-full accent-blue-600 mb-3" />
          <label class="block text-sm text-slate-700" for="n2"><span data-i18n="n2">Lower medium n₂</span>: <span id="n2Out" class="font-semibold text-blue-600">1.50</span></label>
          <input id="n2" type="range" min="1.00" max="2.50" step="0.01" value="1.50" class="w-full accent-blue-600 mb-3" />
          <label class="block text-sm text-slate-700" for="angle"><span data-i18n="incidence">Incidence i (°)</span>: <span id="angleOut" class="font-semibold text-blue-600">35.0</span></label>
          <input id="angle" type="range" min="0" max="89" step="0.1" value="35" class="w-full accent-blue-600 mb-3" />
          <label class="block text-sm text-slate-700" for="mode"><span data-i18n="mode">View mode</span></label>
          <select id="mode" class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white">
            <option value="interface">Interface</option>
            <option value="fiber">Fiber path</option>
          </select>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-4 text-sm">
          <h2 class="font-semibold text-slate-900 mb-2" data-i18n="readings">Readings</h2>
          <div class="space-y-1">
            <div class="flex justify-between"><span class="text-slate-600">sin r</span><span id="sinrOut" class="font-semibold text-green-600">0.382</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="refracted">Refracted r</span><span id="rOut" class="font-semibold text-green-600">22.4°</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="critical">Critical c</span><span id="cOut" class="font-semibold text-amber-600">41.8°</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="tir">TIR</span><span id="tirOut" class="font-semibold text-purple-600">No</span></div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const controls = {
      n1: document.getElementById('n1'),
      n2: document.getElementById('n2'),
      angle: document.getElementById('angle'),
      mode: document.getElementById('mode')
    };
    const out = {
      n1Out: document.getElementById('n1Out'),
      n2Out: document.getElementById('n2Out'),
      angleOut: document.getElementById('angleOut'),
      sinrOut: document.getElementById('sinrOut'),
      rOut: document.getElementById('rOut'),
      cOut: document.getElementById('cOut'),
      tirOut: document.getElementById('tirOut')
    };

    const canvas = document.getElementById('sceneCanvas');
    const resetBtn = document.getElementById('resetBtn');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    let camRadius = 15.2, camTheta = 0.4, camPhi = 1.05;
    const defaultCam = { radius: 15.2, theta: 0.4, phi: 1.05 };
    function updateCameraFromSpherical() {
      camera.position.set(
        camRadius * Math.sin(camPhi) * Math.sin(camTheta),
        camRadius * Math.cos(camPhi),
        camRadius * Math.sin(camPhi) * Math.cos(camTheta)
      );
      camera.lookAt(0, -0.5, 0);
    }
    updateCameraFromSpherical();

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const key = new THREE.DirectionalLight(0xffffff, 0.85);
    key.position.set(9, 11, 8);
    scene.add(key);

    const upperMedium = new THREE.Mesh(
      new THREE.BoxGeometry(10, 0.06, 7),
      new THREE.MeshStandardMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.42 })
    );
    upperMedium.position.y = 0.03;
    scene.add(upperMedium);

    const lowerMedium = new THREE.Mesh(
      new THREE.BoxGeometry(10, 5, 7),
      new THREE.MeshStandardMaterial({ color: 0xbbf7d0, transparent: true, opacity: 0.38 })
    );
    lowerMedium.position.y = -2.47;
    scene.add(lowerMedium);

    const normalLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 4, 0), new THREE.Vector3(0, -4, 0)]),
      new THREE.LineBasicMaterial({ color: 0x64748b })
    );
    scene.add(normalLine);

    function makeRay(color) {
      return new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
        new THREE.LineBasicMaterial({ color, linewidth: 3 })
      );
    }

    const incidentRay = makeRay(0xdc2626);
    const refractedRay = makeRay(0x16a34a);
    const reflectedRay = makeRay(0x9333ea);
    scene.add(incidentRay, refractedRay, reflectedRay);

    const fiberTube = new THREE.Mesh(
      new THREE.BoxGeometry(8, 1.2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3 })
    );
    fiberTube.position.set(0, -1.8, 2.2);
    scene.add(fiberTube);

    const fiberRay = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
      new THREE.LineBasicMaterial({ color: 0xf97316 })
    );
    scene.add(fiberRay);

    function updateSize() {
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(320, Math.floor(rect.width));
      const h = Math.max(240, Math.floor(rect.height));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    const translations = {
      en: {
        back: 'Back to Topics',
        title: '3D Refraction, Critical Angle and TIR Studio',
        subtitle: 'All ray behavior is rendered in 3D with transparent media blocks and dynamic ray vectors.',
        controls: 'Controls',
        n1: 'Upper medium n₁',
        n2: 'Lower medium n₂',
        incidence: 'Incidence i (°)',
        mode: 'View mode',
        readings: 'Readings',
        refracted: 'Refracted r',
        critical: 'Critical c',
        tir: 'TIR',
        yes: 'Yes',
        no: 'No',
        reset: 'Reset',
        camHint: 'Drag to rotate • Pinch to zoom',
        'legend.incident': 'Incident',
        'legend.refracted': 'Refracted',
        'legend.reflected': 'Reflected'
      },
      'zh-hk': {
        back: '返回主題頁',
        title: '3D 折射、臨界角與全內反射模擬',
        subtitle: '所有光線行為均以 3D 透明介質與動態向量呈現。',
        controls: '控制面板',
        n1: '上層介質 n₁',
        n2: '下層介質 n₂',
        incidence: '入射角 i (°)',
        mode: '顯示模式',
        readings: '讀數',
        refracted: '折射角 r',
        critical: '臨界角 c',
        tir: '全內反射',
        yes: '是',
        no: '否',
        reset: '重設',
        camHint: '拖曳旋轉 • 雙指縮放',
        'legend.incident': '入射',
        'legend.refracted': '折射',
        'legend.reflected': '反射'
      }
    };

    function getLang() {
      return document.documentElement.lang === 'zh-HK' ? 'zh-hk' : 'en';
    }

    function compute() {
      const n1 = Number(controls.n1.value);
      const n2 = Number(controls.n2.value);
      const iDeg = Number(controls.angle.value);
      const iRad = (iDeg * Math.PI) / 180;
      const sinr = (n1 / n2) * Math.sin(iRad);
      const hasRefracted = sinr <= 1;
      const rDeg = hasRefracted ? (Math.asin(sinr) * 180) / Math.PI : null;
      const cDeg = n1 > n2 ? (Math.asin(n2 / n1) * 180) / Math.PI : null;
      const isTIR = cDeg !== null && iDeg > cDeg;
      return { n1, n2, iDeg, iRad, sinr, rDeg, cDeg, isTIR };
    }

    function setLinePoints(line, p1, p2) {
      line.geometry.setFromPoints([p1, p2]);
      line.geometry.attributes.position.needsUpdate = true;
    }

    function updateOutputs() {
      const t = translations[getLang()];
      const d = compute();
      out.n1Out.textContent = d.n1.toFixed(2);
      out.n2Out.textContent = d.n2.toFixed(2);
      out.angleOut.textContent = d.iDeg.toFixed(1);
      out.sinrOut.textContent = d.sinr.toFixed(3);
      out.rOut.textContent = d.rDeg === null ? '--' : `${d.rDeg.toFixed(1)}°`;
      out.cOut.textContent = d.cDeg === null ? '--' : `${d.cDeg.toFixed(1)}°`;
      out.tirOut.textContent = d.isTIR ? t.yes : t.no;
    }

    function updateRays(timeSec) {
      const d = compute();
      const modeFiber = controls.mode.value === 'fiber';

      const origin = new THREE.Vector3(0, 0, 0);
      const L = 5.8;
      const pulse = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(timeSec * 2.2));

      if (!modeFiber) {
        upperMedium.visible = true;
        lowerMedium.visible = true;
        normalLine.visible = true;
        incidentRay.visible = true;
        refractedRay.visible = true;
        reflectedRay.visible = d.isTIR;
        fiberTube.visible = false;
        fiberRay.visible = false;

        const inDir = new THREE.Vector3(-Math.sin(d.iRad), Math.cos(d.iRad), 0).normalize();
        const inStart = origin.clone().add(inDir.clone().multiplyScalar(-L));
        const inEnd = origin.clone().add(inDir.clone().multiplyScalar(-0.2 * pulse));
        setLinePoints(incidentRay, inStart, inEnd);

        if (d.isTIR) {
          const reflDir = new THREE.Vector3(Math.sin(d.iRad), Math.cos(d.iRad), 0).normalize();
          setLinePoints(reflectedRay, origin, origin.clone().add(reflDir.multiplyScalar(L)));
          setLinePoints(refractedRay, origin, origin);
        } else {
          const rRad = (d.rDeg || 0) * Math.PI / 180;
          const refrDir = new THREE.Vector3(Math.sin(rRad), -Math.cos(rRad), 0).normalize();
          setLinePoints(refractedRay, origin, origin.clone().add(refrDir.multiplyScalar(L)));
          setLinePoints(reflectedRay, origin, origin);
        }
      } else {
        upperMedium.visible = false;
        lowerMedium.visible = false;
        normalLine.visible = false;
        incidentRay.visible = false;
        refractedRay.visible = false;
        reflectedRay.visible = false;
        fiberTube.visible = true;
        fiberRay.visible = true;

        const points = [];
        const seg = 16;
        let x = -3.8;
        let y = -1.8;
        let z = 2.2;
        let dirY = 0.16 + Math.sin((d.iDeg * Math.PI) / 180) * 0.28;
        for (let i = 0; i < seg; i += 1) {
          points.push(new THREE.Vector3(x, y, z));
          x += 0.5;
          y += dirY;
          if (y > -1.25 || y < -2.35) dirY *= -1;
        }
        points.push(new THREE.Vector3(4.2, y, z));
        fiberRay.geometry.setFromPoints(points);
      }
    }

    function updateLanguage(lang) {
      localStorage.setItem('preferred_language', lang);
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        const key = node.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) node.textContent = translations[lang][key];
      });
      document.documentElement.lang = lang === 'zh-hk' ? 'zh-HK' : 'en';
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle('bg-blue-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-600', !active);
      });
      updateOutputs();
    }

    Object.values(controls).forEach((el) => el.addEventListener('input', updateOutputs));
    window.addEventListener('resize', updateSize);
    resetBtn.addEventListener('click', () => {
      controls.n1.value = 1.00;
      controls.n2.value = 1.50;
      controls.angle.value = 35;
      controls.mode.value = 'interface';
      camRadius = defaultCam.radius;
      camTheta = defaultCam.theta;
      camPhi = defaultCam.phi;
      updateCameraFromSpherical();
      updateOutputs();
    });

    let isCamDrag = false, lastX = 0, lastY = 0, pinchDist = null;
    canvas.addEventListener('mousedown', (e) => {
      isCamDrag = true; lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('mouseup', () => { isCamDrag = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isCamDrag) return;
      camTheta -= (e.clientX - lastX) * 0.006;
      camPhi = Math.max(0.15, Math.min(Math.PI - 0.15, camPhi + (e.clientY - lastY) * 0.006));
      lastX = e.clientX; lastY = e.clientY;
      updateCameraFromSpherical();
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      camRadius = Math.max(6, Math.min(28, camRadius + e.deltaY * 0.015));
      updateCameraFromSpherical();
    }, { passive: false });
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isCamDrag = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isCamDrag = false;
        pinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isCamDrag) {
        camTheta -= (e.touches[0].clientX - lastX) * 0.008;
        camPhi = Math.max(0.15, Math.min(Math.PI - 0.15, camPhi + (e.touches[0].clientY - lastY) * 0.008));
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        updateCameraFromSpherical();
      } else if (e.touches.length === 2 && pinchDist !== null) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        camRadius = Math.max(6, Math.min(28, camRadius - (dist - pinchDist) * 0.03));
        pinchDist = dist;
        updateCameraFromSpherical();
      }
    }, { passive: false });
    canvas.addEventListener('touchend', () => { isCamDrag = false; pinchDist = null; });

    updateSize();
    updateOutputs();
    updateLanguage(localStorage.getItem('preferred_language') === 'zh-hk' ? 'zh-hk' : 'en');

    function tick(ms) {
      const t = ms * 0.001;
      updateRays(t);
      // Soft pulse on ray materials
      const pulse = 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(t * 3));
      incidentRay.material.opacity = pulse;
      refractedRay.material.opacity = pulse;
      reflectedRay.material.opacity = pulse;
      incidentRay.material.transparent = true;
      refractedRay.material.transparent = true;
      reflectedRay.material.transparent = true;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>

    <!-- Practice Questions Widget -->
    <script src="practice_questions.js"></script>
    <script src="practice_questions_data.js"></script>
    <script>initPracticeQuestions('refraction_critical_angle');</script>
</body>
</html>
