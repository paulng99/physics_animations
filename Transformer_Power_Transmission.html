<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Transformer and Power Transmission (HKDSE)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    mjx-container { display: inline-block !important; }
    .glass { background: rgba(255,255,255,0.88); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-blue-50 text-slate-800">
  <header class="max-w-7xl mx-auto px-4 py-4">
    <div class="flex items-center justify-between gap-3">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-blue-600 hover:text-blue-700">
        <span>←</span><span data-i18n="back">Back to Topics</span>
      </a>
      <div class="flex gap-2">
        <button class="lang-btn px-3 py-1 rounded-lg text-sm font-medium bg-blue-600 text-white" data-lang="en" onclick="updateLanguage('en')">EN</button>
        <button class="lang-btn px-3 py-1 rounded-lg text-sm font-medium text-slate-600 hover:bg-blue-100" data-lang="zh-hk" onclick="updateLanguage('zh-hk')">繁</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 pb-12">
    <section class="glass rounded-3xl border border-white/70 p-6 md:p-8 shadow-xl shadow-blue-100/40">
      <h1 class="text-2xl md:text-4xl font-extrabold text-slate-900" data-i18n="title">3D Transformer & Transmission Studio</h1>
      <p class="mt-2 text-slate-600" data-i18n="subtitle">Power station, step-up transformer, transmission tower, and city load in one 3D learning scene.</p>
    </section>

    <section class="mt-6 grid xl:grid-cols-[1.45fr_1fr] gap-5">
      <article class="glass rounded-3xl border border-white/70 p-4">
        <canvas id="simCanvas" width="1200" height="640" class="w-full rounded-2xl border border-slate-200 bg-slate-50"></canvas>
      </article>

      <aside class="space-y-4">
        <div class="glass rounded-2xl border border-white/70 p-4">
          <h2 class="font-semibold text-slate-900 mb-3" data-i18n="controls">Controls</h2>

          <label class="block text-sm text-slate-700" for="plantV"><span data-i18n="plantV">Generator voltage Vp (kV)</span>: <span id="plantVOut" class="text-blue-600 font-semibold">11.0</span></label>
          <input id="plantV" type="range" min="3" max="25" step="0.1" value="11" class="w-full accent-blue-600 mb-3" />

          <label class="block text-sm text-slate-700" for="loadMW"><span data-i18n="loadMW">Demand power (MW)</span>: <span id="loadMWOut" class="text-blue-600 font-semibold">3.5</span></label>
          <input id="loadMW" type="range" min="0.5" max="12" step="0.1" value="3.5" class="w-full accent-blue-600 mb-3" />

          <label class="block text-sm text-slate-700" for="stepRatio"><span data-i18n="stepRatio">Step-up ratio Ns/Np</span>: <span id="stepRatioOut" class="text-blue-600 font-semibold">20.0</span></label>
          <input id="stepRatio" type="range" min="2" max="60" step="0.5" value="20" class="w-full accent-blue-600 mb-3" />

          <label class="block text-sm text-slate-700" for="lineR"><span data-i18n="lineR">Line resistance (Ω)</span>: <span id="lineROut" class="text-blue-600 font-semibold">5.0</span></label>
          <input id="lineR" type="range" min="0.5" max="30" step="0.1" value="5" class="w-full accent-blue-600 mb-3" />

          <label class="block text-sm text-slate-700" for="mode"><span data-i18n="mode">Comparison mode</span></label>
          <select id="mode" class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white">
            <option value="normal">With step-up transformer</option>
            <option value="no-stepup">Without step-up</option>
          </select>
        </div>

        <div class="glass rounded-2xl border border-white/70 p-4 text-sm">
          <h2 class="font-semibold text-slate-900 mb-2" data-i18n="readings">Readings</h2>
          <div class="space-y-1.5">
            <div class="flex justify-between"><span class="text-slate-600">Vs</span><span id="vsOut" class="font-semibold text-purple-700">220.0 kV</span></div>
            <div class="flex justify-between"><span class="text-slate-600">Iline</span><span id="ilineOut" class="font-semibold text-green-700">15.9 A</span></div>
            <div class="flex justify-between"><span class="text-slate-600">Ploss</span><span id="lossOut" class="font-semibold text-red-700">12.6 kW</span></div>
            <div class="flex justify-between"><span class="text-slate-600">Efficiency</span><span id="effOut" class="font-semibold text-blue-700">99.6%</span></div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const controls = {
      plantV: document.getElementById('plantV'),
      loadMW: document.getElementById('loadMW'),
      stepRatio: document.getElementById('stepRatio'),
      lineR: document.getElementById('lineR'),
      mode: document.getElementById('mode')
    };
    const out = {
      plantVOut: document.getElementById('plantVOut'),
      loadMWOut: document.getElementById('loadMWOut'),
      stepRatioOut: document.getElementById('stepRatioOut'),
      lineROut: document.getElementById('lineROut'),
      vsOut: document.getElementById('vsOut'),
      ilineOut: document.getElementById('ilineOut'),
      lossOut: document.getElementById('lossOut'),
      effOut: document.getElementById('effOut')
    };

    const canvas = document.getElementById('simCanvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);
    const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(32, 14),
      new THREE.MeshStandardMaterial({ color: 0xe6edf7, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    scene.add(new THREE.AmbientLight(0xffffff, 0.74));
    const key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(8, 14, 8);
    scene.add(key);

    camera.position.set(0, 9, 15);
    camera.lookAt(0, 1, 0);

    const plant = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 1.2, 2.2),
      new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.5 })
    );
    plant.position.set(-11, 0.6, 0);
    scene.add(plant);

    const stepUp = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 1.6, 1.6),
      new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.5 })
    );
    stepUp.position.set(-6.5, 0.8, 0);
    scene.add(stepUp);

    const tower = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25, 0.35, 5.5, 8),
      new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 })
    );
    tower.position.set(0.3, 2.75, 0);
    scene.add(tower);

    const stepDown = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 1.4, 1.6),
      new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.5 })
    );
    stepDown.position.set(6.4, 0.7, 0);
    scene.add(stepDown);

    const city = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 2.2, 2.2),
      new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.35 })
    );
    city.position.set(11, 1.1, 0);
    scene.add(city);

    function buildLine() {
      const pts = [
        new THREE.Vector3(-10, 2.7, 0),
        new THREE.Vector3(-5.8, 3.3, 0),
        new THREE.Vector3(0.3, 4.6, 0),
        new THREE.Vector3(6.2, 3.2, 0),
        new THREE.Vector3(10.5, 2.7, 0)
      ];
      return new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x1d4ed8 })
      );
    }
    const line = buildLine();
    scene.add(line);

    const pulseCount = 26;
    const pulses = [];
    for (let i = 0; i < pulseCount; i += 1) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 0.65 })
      );
      scene.add(m);
      pulses.push({ mesh: m, t: i / pulseCount });
    }

    const translations = {
      en: {
        back: 'Back to Topics',
        title: '3D Transformer & Transmission Studio',
        subtitle: 'Power station, step-up transformer, transmission tower, and city load in one 3D learning scene.',
        controls: 'Controls',
        plantV: 'Generator voltage Vp (kV)',
        loadMW: 'Demand power (MW)',
        stepRatio: 'Step-up ratio Ns/Np',
        lineR: 'Line resistance (Ω)',
        mode: 'Comparison mode',
        readings: 'Readings'
      },
      'zh-hk': {
        back: '返回主題頁',
        title: '3D 變壓器與輸電模擬',
        subtitle: '以 3D 場景展示電站、升壓、輸電鐵塔與城市負載。',
        controls: '控制面板',
        plantV: '發電端電壓 Vp (kV)',
        loadMW: '需求功率 (MW)',
        stepRatio: '升壓比 Ns/Np',
        lineR: '線路電阻 (Ω)',
        mode: '比較模式',
        readings: '讀數'
      }
    };

    function compute() {
      const plantV = Number(controls.plantV.value) * 1000;
      const loadP = Number(controls.loadMW.value) * 1e6;
      const ratio = Number(controls.stepRatio.value);
      const lineR = Number(controls.lineR.value);
      const noStep = controls.mode.value === 'no-stepup';
      const lineV = noStep ? plantV : plantV * ratio;
      const lineI = loadP / Math.max(lineV, 1);
      const loss = lineI * lineI * lineR;
      const eff = Math.max(0, ((loadP - loss) / loadP) * 100);
      return { plantV, loadP, ratio, lineR, lineV, lineI, loss, eff, noStep };
    }

    function linePoint(t) {
      const pts = line.geometry.attributes.position.array;
      const arr = [];
      for (let i = 0; i < pts.length; i += 3) arr.push(new THREE.Vector3(pts[i], pts[i + 1], pts[i + 2]));
      const seg = (arr.length - 1) * t;
      const i = Math.min(arr.length - 2, Math.floor(seg));
      const lt = seg - i;
      return arr[i].clone().lerp(arr[i + 1], lt);
    }

    function updateOutputs() {
      const d = compute();
      out.plantVOut.textContent = (d.plantV / 1000).toFixed(1);
      out.loadMWOut.textContent = (d.loadP / 1e6).toFixed(1);
      out.stepRatioOut.textContent = d.ratio.toFixed(1);
      out.lineROut.textContent = d.lineR.toFixed(1);
      out.vsOut.textContent = `${(d.lineV / 1000).toFixed(1)} kV`;
      out.ilineOut.textContent = `${d.lineI.toFixed(1)} A`;
      out.lossOut.textContent = `${(d.loss / 1000).toFixed(2)} kW`;
      out.effOut.textContent = `${d.eff.toFixed(1)}%`;
      const pulseColor = d.noStep ? 0xef4444 : 0xf59e0b;
      pulses.forEach((p) => p.mesh.material.color.setHex(pulseColor));
      line.material.color.setHex(d.noStep ? 0xef4444 : 0x1d4ed8);
    }

    function resizeRenderer() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (w && h && (canvas.width !== w || canvas.height !== h)) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }

    function updateLanguage(lang) {
      localStorage.setItem('preferred_language', lang);
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        const key = node.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) node.textContent = translations[lang][key];
      });
      document.documentElement.lang = lang === 'zh-hk' ? 'zh-HK' : 'en';
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle('bg-blue-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-600', !active);
      });
      updateOutputs();
    }

    Object.values(controls).forEach((el) => el.addEventListener('input', updateOutputs));

    let time = 0;
    function animate() {
      time += 0.007 + compute().lineI * 0.00008;
      resizeRenderer();
      pulses.forEach((p) => {
        p.t = (p.t + 0.0032 + compute().lineI * 0.00004) % 1;
        p.mesh.position.copy(linePoint(p.t));
      });
      tower.rotation.y += 0.003;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    updateOutputs();
    updateLanguage(localStorage.getItem('preferred_language') === 'zh-hk' ? 'zh-hk' : 'en');
    requestAnimationFrame(animate);
  </script>
</body>
</html>
