<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domestic Electricity Safety Trainer 3D (HKDSE)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    mjx-container { display: inline-block !important; }
    .glass { background: rgba(255,255,255,0.88); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-blue-50 text-slate-800">
  <header class="max-w-7xl mx-auto px-4 py-4">
    <div class="flex items-center justify-between gap-3">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-blue-600 hover:text-blue-700">
        <span>←</span><span data-i18n="back">Back to Topics</span>
      </a>
      <div class="flex gap-2">
        <button class="lang-btn px-3 py-1 rounded-lg text-sm bg-blue-600 text-white" data-lang="en" onclick="updateLanguage('en')">EN</button>
        <button class="lang-btn px-3 py-1 rounded-lg text-sm text-slate-600 hover:bg-blue-100" data-lang="zh-hk" onclick="updateLanguage('zh-hk')">繁</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 pb-12">
    <section class="glass rounded-3xl border border-white/70 p-6 md:p-8 shadow-xl shadow-blue-100/40">
      <h1 class="text-2xl md:text-4xl font-extrabold text-slate-900" data-i18n="title">Domestic Electricity Safety Trainer (3D)</h1>
      <p class="mt-3 text-slate-600" data-i18n="subtitle">3D wiring-board animation for fuse, MCB, earth leakage and shock-risk scenarios.</p>
    </section>

    <section class="mt-6 grid xl:grid-cols-[1.5fr_1fr] gap-5">
      <article class="glass rounded-3xl border border-white/70 p-4">
        <canvas id="board3d" width="1220" height="650" class="w-full rounded-2xl border border-slate-200 bg-slate-50"></canvas>
      </article>

      <aside class="space-y-4">
        <div class="glass rounded-2xl border border-white/70 p-4">
          <h2 class="font-semibold text-slate-900 mb-3" data-i18n="controls">Control Panel</h2>
          <label class="block text-sm text-slate-700 mb-1" data-i18n="scenario">Scenario</label>
          <select id="scenario" class="w-full rounded-lg border border-slate-300 px-3 py-2 mb-3 bg-white">
            <option value="normal">Normal operation</option>
            <option value="overload">Overload</option>
            <option value="short">Live-neutral short</option>
            <option value="leak-earth">Leakage with earth</option>
            <option value="leak-no-earth">Leakage without earth</option>
          </select>

          <label class="block text-sm text-slate-700 mb-1"><span data-i18n="load">Load current demand (A)</span>: <span id="loadOut" class="font-semibold text-blue-600">12.0</span></label>
          <input id="load" type="range" min="1" max="60" step="0.5" value="12" class="w-full accent-blue-600 mb-3" />

          <label class="block text-sm text-slate-700 mb-1"><span data-i18n="fuse">Fuse rating (A)</span>: <span id="fuseOut" class="font-semibold text-blue-600">13</span></label>
          <input id="fuse" type="range" min="5" max="40" step="1" value="13" class="w-full accent-blue-600 mb-3" />

          <label class="block text-sm text-slate-700 mb-1"><span data-i18n="mcb">MCB rating (A)</span>: <span id="mcbOut" class="font-semibold text-blue-600">20</span></label>
          <input id="mcb" type="range" min="6" max="63" step="1" value="20" class="w-full accent-blue-600 mb-3" />

          <label class="flex items-center gap-2 text-sm">
            <input id="earthConnected" type="checkbox" class="accent-blue-600" checked />
            <span data-i18n="earthConnected">Earth wire connected</span>
          </label>
          <label class="flex items-center gap-2 text-sm mt-2">
            <input id="touchingCase" type="checkbox" class="accent-blue-600" />
            <span data-i18n="touchingCase">Person touching case</span>
          </label>

          <div class="mt-3 grid grid-cols-2 gap-2">
            <button type="button" id="btn-preset-safe" class="py-2.5 rounded-xl bg-green-100 hover:bg-green-200 text-xs font-semibold text-green-800 transition hover:-translate-y-0.5" data-i18n="preset.safe">Safe demo</button>
            <button type="button" id="btn-preset-shock" class="py-2.5 rounded-xl bg-red-100 hover:bg-red-200 text-xs font-semibold text-red-800 transition hover:-translate-y-0.5" data-i18n="preset.shock">Shock risk</button>
          </div>
          <button type="button" id="btn-reset-board" class="mt-2 w-full py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5" data-i18n="reset">Reset</button>
        </div>

        <div class="glass rounded-2xl border border-white/70 p-4 text-sm">
          <h2 class="font-semibold text-slate-900 mb-2" data-i18n="statusTitle">Safety Status</h2>
          <div class="space-y-1">
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="lineCurrent">Line current</span><span id="lineCurrentOut" class="font-semibold text-green-600">12.0 A</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="tripDevice">Trip device</span><span id="tripOut" class="font-semibold text-purple-600">None</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="touchVoltage">Case touch voltage</span><span id="touchVOut" class="font-semibold text-red-600">0 V</span></div>
            <div class="flex justify-between"><span class="text-slate-600" data-i18n="shockRisk">Shock risk</span><span id="riskOut" class="font-semibold text-green-600">Low</span></div>
          </div>
          <p id="statusMsg" class="mt-2 text-xs text-slate-600"></p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const controls = {
      scenario: document.getElementById('scenario'),
      load: document.getElementById('load'),
      fuse: document.getElementById('fuse'),
      mcb: document.getElementById('mcb'),
      earthConnected: document.getElementById('earthConnected'),
      touchingCase: document.getElementById('touchingCase')
    };
    const out = {
      loadOut: document.getElementById('loadOut'),
      fuseOut: document.getElementById('fuseOut'),
      mcbOut: document.getElementById('mcbOut'),
      lineCurrentOut: document.getElementById('lineCurrentOut'),
      tripOut: document.getElementById('tripOut'),
      touchVOut: document.getElementById('touchVOut'),
      riskOut: document.getElementById('riskOut'),
      statusMsg: document.getElementById('statusMsg')
    };

    const translations = {
      en: {
        back: 'Back to Topics',
        title: 'Domestic Electricity Safety Trainer (3D)',
        subtitle: '3D wiring-board animation for fuse, MCB, earth leakage and shock-risk scenarios.',
        controls: 'Control Panel',
        scenario: 'Scenario',
        load: 'Load current demand (A)',
        fuse: 'Fuse rating (A)',
        mcb: 'MCB rating (A)',
        earthConnected: 'Earth wire connected',
        touchingCase: 'Person touching case',
        statusTitle: 'Safety Status',
        lineCurrent: 'Line current',
        tripDevice: 'Trip device',
        touchVoltage: 'Case touch voltage',
        shockRisk: 'Shock risk',
        reset: 'Reset',
        'preset.safe': 'Safe demo',
        'preset.shock': 'Shock risk'
      },
      'zh-hk': {
        back: '返回主題頁',
        title: '家居用電安全訓練器（3D）',
        subtitle: '以 3D 配線板動畫展示保險絲、MCB、漏電與觸電風險情境。',
        controls: '控制面板',
        scenario: '情境',
        load: '負載需求電流 (A)',
        fuse: '保險絲額定值 (A)',
        mcb: 'MCB 額定值 (A)',
        earthConnected: '已接駁地線',
        touchingCase: '人體觸碰外殼',
        statusTitle: '安全狀態',
        lineCurrent: '線路電流',
        tripDevice: '跳掣裝置',
        touchVoltage: '外殼觸碰電壓',
        shockRisk: '觸電風險',
        reset: '重設',
        'preset.safe': '安全示範',
        'preset.shock': '觸電風險'
      }
    };

    const canvas = document.getElementById('board3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);
    const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    camera.position.set(0, 9, 18);
    camera.lookAt(0, 2.2, 0);

    let camTheta = 0, camPhi = Math.acos(9 / Math.sqrt(9*9+18*18)), camRadius = Math.sqrt(9*9+18*18);
    const defaultCam = { theta: camTheta, phi: camPhi, radius: camRadius };
    let userInteracted = false;
    let liveEmissive = 0.55, neutralEmissive = 0.42, earthEmissive = 0.35;

    function updateCameraFromSpherical() {
      camera.position.x = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
      camera.position.y = camRadius * Math.cos(camPhi);
      camera.position.z = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
      camera.lookAt(0, 2.2, 0);
    }

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const key = new THREE.DirectionalLight(0xffffff, 0.95);
    key.position.set(12, 14, 10);
    scene.add(key);

    const board = new THREE.Mesh(
      new THREE.BoxGeometry(22, 0.6, 10),
      new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.95 })
    );
    board.position.y = 1.2;
    scene.add(board);

    const lineMatLive = new THREE.MeshStandardMaterial({ color: 0xdc2626, emissive: 0x220000 });
    const lineMatNeutral = new THREE.MeshStandardMaterial({ color: 0x2563eb, emissive: 0x001122 });
    const lineMatEarth = new THREE.MeshStandardMaterial({ color: 0x16a34a, emissive: 0x001a08 });
    const cableGeom = new THREE.CylinderGeometry(0.11, 0.11, 8.5, 20);

    const live = new THREE.Mesh(cableGeom, lineMatLive);
    live.rotation.z = Math.PI / 2;
    live.position.set(0, 2.05, -2.6);
    scene.add(live);

    const neutral = new THREE.Mesh(cableGeom, lineMatNeutral);
    neutral.rotation.z = Math.PI / 2;
    neutral.position.set(0, 2.05, 0);
    scene.add(neutral);

    const earth = new THREE.Mesh(cableGeom, lineMatEarth);
    earth.rotation.z = Math.PI / 2;
    earth.position.set(0, 2.05, 2.6);
    scene.add(earth);

    const fuseMesh = new THREE.Mesh(
      new THREE.BoxGeometry(2.1, 1.35, 1.15),
      new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 })
    );
    fuseMesh.position.set(-5.8, 2.35, -2.6);
    scene.add(fuseMesh);

    const mcbMesh = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, 1.35, 1.15),
      new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 })
    );
    mcbMesh.position.set(-2.1, 2.35, -2.6);
    scene.add(mcbMesh);

    const caseMesh = new THREE.Mesh(
      new THREE.BoxGeometry(4.7, 3.4, 2.8),
      new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.75, metalness: 0.2 })
    );
    caseMesh.position.set(6.8, 2.8, -0.2);
    scene.add(caseMesh);

    const person = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2.2, 16), new THREE.MeshStandardMaterial({ color: 0x111827 }));
    body.position.y = 2;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
    head.position.y = 3.5;
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.25, 12), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
    arm.rotation.z = -0.95;
    arm.position.set(0.65, 2.35, 0);
    person.add(body, head, arm);
    person.position.set(10.2, 0.8, -0.2);
    person.visible = false;
    scene.add(person);

    const spark = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0x7c2d12, emissiveIntensity: 0.7 })
    );
    spark.position.set(8.95, 2.55, -0.2);
    spark.visible = false;
    scene.add(spark);

    // Flowing current particles on live / neutral / earth
    const flowParticles = { live: [], neutral: [], earth: [] };
    function makeCableParticles(color, z, bag) {
      const geo = new THREE.SphereGeometry(0.09, 10, 10);
      const mat = new THREE.MeshBasicMaterial({ color });
      for (let i = 0; i < 12; i++) {
        const m = new THREE.Mesh(geo, mat);
        m.userData.t = i / 12;
        m.userData.z = z;
        scene.add(m);
        bag.push(m);
      }
    }
    makeCableParticles(0xdc2626, -2.6, flowParticles.live);
    makeCableParticles(0x2563eb, 0, flowParticles.neutral);
    makeCableParticles(0x16a34a, 2.6, flowParticles.earth);

    let pulse = 0;

    function applyScenario() {
      const s = controls.scenario.value;
      if (s === 'normal') {
        controls.load.value = '12';
        controls.earthConnected.checked = true;
      } else if (s === 'overload') {
        controls.load.value = '34';
        controls.earthConnected.checked = true;
      } else if (s === 'short') {
        controls.load.value = '58';
        controls.earthConnected.checked = true;
      } else if (s === 'leak-earth') {
        controls.load.value = '10';
        controls.earthConnected.checked = true;
      } else if (s === 'leak-no-earth') {
        controls.load.value = '10';
        controls.earthConnected.checked = false;
      }
    }

    function evaluate() {
      const load = Number(controls.load.value);
      const fuse = Number(controls.fuse.value);
      const mcb = Number(controls.mcb.value);
      const earthConnected = controls.earthConnected.checked;
      const touch = controls.touchingCase.checked;
      const scenario = controls.scenario.value;

      let current = load;
      let touchV = 0;
      let trip = 'None';
      let risk = 'Low';
      let msgEn = 'Normal supply path.';
      let msgHk = '正常供電路徑。';

      const leakage = scenario === 'leak-earth' || scenario === 'leak-no-earth';
      const short = scenario === 'short';

      if (short) {
        current = load + 120;
        msgEn = 'Short circuit causes very high current.';
        msgHk = '短路導致極大電流。';
      } else if (leakage) {
        if (earthConnected) {
          current = load + 26;
          touchV = 22;
          msgEn = 'Earth wire drains leakage current.';
          msgHk = '地線把漏電電流導走。';
        } else {
          current = load + 4;
          touchV = 220;
          msgEn = 'No earth path, case can stay live.';
          msgHk = '沒有地線回路，外殼可帶電。';
        }
      } else if (scenario === 'overload') {
        current = load;
        msgEn = 'Overload: current above normal usage.';
        msgHk = '過載：電流超出正常使用。';
      }

      if (current > fuse || current > mcb) {
        if (current > fuse && fuse <= mcb) trip = 'Fuse';
        else if (current > mcb && mcb < fuse) trip = 'MCB';
        else trip = 'Fuse/MCB';
      }

      if (touch && touchV > 150) risk = 'High';
      else if (touch && touchV > 30) risk = 'Medium';
      else risk = 'Low';

      return { current, touchV, trip, risk, msgEn, msgHk, leakage, short, earthConnected, touch };
    }

    function updateOutputs() {
      const d = evaluate();
      out.loadOut.textContent = Number(controls.load.value).toFixed(1);
      out.fuseOut.textContent = Number(controls.fuse.value).toFixed(0);
      out.mcbOut.textContent = Number(controls.mcb.value).toFixed(0);
      out.lineCurrentOut.textContent = `${d.current.toFixed(1)} A`;
      out.tripOut.textContent = d.trip;
      out.touchVOut.textContent = `${d.touchV.toFixed(0)} V`;
      out.riskOut.textContent = d.risk;

      const zh = document.documentElement.lang === 'zh-HK';
      out.statusMsg.textContent = zh ? d.msgHk : d.msgEn;

      if (d.risk === 'High') out.riskOut.className = 'font-semibold text-red-600';
      else if (d.risk === 'Medium') out.riskOut.className = 'font-semibold text-amber-600';
      else out.riskOut.className = 'font-semibold text-green-600';

      earth.visible = d.earthConnected;
      person.visible = d.touch;
      spark.visible = d.touch && d.touchV > 30;
      liveEmissive = d.trip === 'None' ? 0.55 : 0.12;
      neutralEmissive = d.trip === 'None' ? 0.42 : 0.08;
      earthEmissive = d.earthConnected ? (d.leakage ? 0.8 : 0.35) : 0.06;
      fuseMesh.material.color.set(d.trip.includes('Fuse') ? 0xef4444 : 0x334155);
      mcbMesh.material.color.set(d.trip.includes('MCB') ? 0xef4444 : 0x334155);
      caseMesh.material.emissive.set(d.touchV > 150 ? 0x7c2d12 : d.touchV > 20 ? 0x78350f : 0x000000);
      caseMesh.material.emissiveIntensity = d.touchV > 0 ? 0.5 : 0;

      // Particle visibility
      const flowing = d.trip === 'None';
      flowParticles.live.forEach((p) => { p.visible = flowing; });
      flowParticles.neutral.forEach((p) => { p.visible = flowing; });
      flowParticles.earth.forEach((p) => { p.visible = d.earthConnected && (d.leakage || flowing); });
    }

    function resizeRenderer() {
      const rect = canvas.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const w = Math.floor(rect.width);
      const h = Math.floor(rect.height);
      if (canvas.width !== w || canvas.height !== h) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }

    function animate() {
      resizeRenderer();
      pulse += 0.06;

      if (!userInteracted) {
        camTheta += 0.0018;
        updateCameraFromSpherical();
      } else {
        board.rotation.y += (0 - board.rotation.y) * 0.08;
      }
      if (!userInteracted) {
        board.rotation.y = Math.sin(pulse * 0.25) * 0.08;
      }

      // Lerp cable glow
      lineMatLive.emissiveIntensity += (liveEmissive - lineMatLive.emissiveIntensity) * 0.08;
      lineMatNeutral.emissiveIntensity += (neutralEmissive - lineMatNeutral.emissiveIntensity) * 0.08;
      lineMatEarth.emissiveIntensity += (earthEmissive - lineMatEarth.emissiveIntensity) * 0.08;

      spark.scale.setScalar(0.8 + Math.abs(Math.sin(pulse * 6)) * 1.2);

      const speed = 0.01 + Number(controls.load.value) * 0.00025;
      const updateBag = (arr) => {
        arr.forEach((p) => {
          if (!p.visible) return;
          p.userData.t = (p.userData.t + speed) % 1;
          p.position.set(-4.2 + p.userData.t * 8.4, 2.35, p.userData.z);
        });
      };
      updateBag(flowParticles.live);
      updateBag(flowParticles.neutral);
      updateBag(flowParticles.earth);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function updateLanguage(lang) {
      localStorage.setItem('preferred_language', lang);
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        const text = translations[lang] && translations[lang][key];
        if (text) el.textContent = text;
      });
      document.documentElement.lang = lang === 'zh-hk' ? 'zh-HK' : 'en';
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle('bg-blue-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-600', !active);
      });
      updateOutputs();
    }

    controls.scenario.addEventListener('change', () => { userInteracted = true; applyScenario(); updateOutputs(); });
    Object.values(controls).forEach((ctrl) => ctrl.addEventListener('input', () => { userInteracted = true; updateOutputs(); }));

    document.getElementById('btn-preset-safe').onclick = () => {
      userInteracted = true;
      controls.scenario.value = 'normal';
      applyScenario();
      controls.touchingCase.checked = false;
      updateOutputs();
    };
    document.getElementById('btn-preset-shock').onclick = () => {
      userInteracted = true;
      controls.scenario.value = 'leak-no-earth';
      applyScenario();
      controls.touchingCase.checked = true;
      updateOutputs();
    };
    document.getElementById('btn-reset-board').onclick = () => {
      userInteracted = true;
      controls.scenario.value = 'normal';
      controls.fuse.value = 13;
      controls.mcb.value = 20;
      controls.touchingCase.checked = false;
      applyScenario();
      camTheta = defaultCam.theta;
      camPhi = defaultCam.phi;
      camRadius = defaultCam.radius;
      updateCameraFromSpherical();
      updateOutputs();
    };

    // Camera drag + touch
    let isCamDrag = false, startX, startY, lastTouchDist = null, lastTouchX = null, lastTouchY = null;
    canvas.addEventListener('mousedown', (e) => {
      isCamDrag = true;
      startX = e.clientX;
      startY = e.clientY;
      userInteracted = true;
    });
    window.addEventListener('mouseup', () => { isCamDrag = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isCamDrag) return;
      camTheta -= (e.clientX - startX) * 0.005;
      camPhi -= (e.clientY - startY) * 0.005;
      camPhi = Math.max(0.2, Math.min(Math.PI / 2.1, camPhi));
      startX = e.clientX;
      startY = e.clientY;
      updateCameraFromSpherical();
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      userInteracted = true;
      camRadius = Math.max(10, Math.min(32, camRadius + e.deltaY * 0.04));
      updateCameraFromSpherical();
    }, { passive: false });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      userInteracted = true;
      if (e.touches.length === 1) {
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        lastTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && lastTouchX !== null) {
        camTheta -= (e.touches[0].clientX - lastTouchX) * 0.008;
        camPhi -= (e.touches[0].clientY - lastTouchY) * 0.008;
        camPhi = Math.max(0.2, Math.min(Math.PI / 2.1, camPhi));
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        updateCameraFromSpherical();
      } else if (e.touches.length === 2 && lastTouchDist !== null) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        camRadius = Math.max(10, Math.min(32, camRadius + (lastTouchDist - dist) * 0.1));
        lastTouchDist = dist;
        updateCameraFromSpherical();
      }
    }, { passive: false });
    canvas.addEventListener('touchend', () => { lastTouchX = lastTouchY = lastTouchDist = null; });

    applyScenario();
    updateOutputs();
    updateLanguage(localStorage.getItem('preferred_language') === 'zh-hk' ? 'zh-hk' : 'en');
    updateCameraFromSpherical();
    requestAnimationFrame(animate);
  </script>
